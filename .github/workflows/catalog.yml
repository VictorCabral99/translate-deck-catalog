name: catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar tdeck-core
        run: pip install "git+https://github.com/VictorCabral99/translate-deck.git#subdirectory=core"
      - name: Validar catalogo
        run: python scripts/build_index.py --check
      - name: Regenerar indice e publicar Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/build_index.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.sha256
          git diff --cached --quiet || git commit -m "chore: regenerar indice"
          git push

  pages:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
